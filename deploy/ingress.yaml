apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gambit
spec:
  ingressClassName: traefik
  rules:
    - host: gambit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gambit
                port:
                  name: http
